<style>
    :root {
        --ios-bg: #F2F2F7;
        --ios-card: #FFFFFF;
        --ios-blue: #007AFF;
        --ios-blue-glow: rgba(0, 122, 255, 0.25);
        --ios-green: #34C759;
        --ios-red: #FF3B30;
        --ios-gold: #FFD700;
        --ios-gold-glow: rgba(255, 215, 0, 0.4);
        --ios-orange: #FF9500;
        --ios-text: #1C1C1E;
        --ios-subtext: #8E8E93;
        --ios-border: rgba(60, 60, 67, 0.1);
        --ios-card-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
        margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
        background: var(--ios-bg);
        color: var(--ios-text);
        height: 100%;
        overflow: hidden;
    }

    .ios-app { display: flex; flex-direction: column; height: 100vh; }

    /* Next-Gen Glassmorphism Glowing Hero */
    .ios-hero-header {
        position: relative;
        background: linear-gradient(135deg, #051A3B 0%, #0040DD 50%, #007AFF 100%);
        padding: 24px 18px 18px;
        color: #FFFFFF;
        border-bottom-left-radius: 28px;
        border-bottom-right-radius: 28px;
        box-shadow: 0 12px 35px rgba(0, 64, 221, 0.35);
        z-index: 90;
        overflow: hidden;
    }

    .ios-hero-glow { position: absolute; border-radius: 50%; filter: blur(45px); pointer-events: none; }
    .glow-1 { top: -30%; right: -10%; width: 220px; height: 220px; background: rgba(255, 215, 0, 0.25); }
    .glow-2 { bottom: -40%; left: -10%; width: 180px; height: 180px; background: rgba(52, 199, 89, 0.25); }
    .glow-3 { top: 20%; left: 30%; width: 150px; height: 150px; background: rgba(0, 122, 255, 0.4); }

    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .fav-quick-btn {
        background: rgba(255, 255, 255, 0.18); border: 0.5px solid rgba(255, 255, 255, 0.3);
        color: var(--ios-gold); padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 800;
        backdrop-filter: blur(8px); cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    .ios-subtitle-pill {
        font-size: 9px; font-weight: 800; color: #FFFFFF;
        background: rgba(255, 255, 255, 0.22); padding: 3px 10px; border-radius: 12px;
        letter-spacing: 0.8px; backdrop-filter: blur(8px);
    }
    .ios-title { font-size: 22px; font-weight: 900; margin: 0; color: #FFFFFF; letter-spacing: -0.5px; }

    .ios-status-badge {
        display: inline-flex; align-items: center; gap: 5px;
        background: rgba(255, 255, 255, 0.2); color: #FFF;
        font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 16px;
        border: 0.5px solid rgba(255, 255, 255, 0.3);
    }
    .pulse-dot { width: 6px; height: 6px; background: #30D158; border-radius: 50%; box-shadow: 0 0 8px #30D158; animation: pulse 1.6s infinite; }

    @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Favorite Match Today Alert Banner */
    .fav-today-banner {
        background: linear-gradient(90deg, #FFF9E6 0%, #FFF3CC 100%);
        border: 1px solid var(--ios-gold); border-radius: 16px;
        padding: 12px 14px; margin-bottom: 14px; display: flex;
        align-items: center; justify-content: space-between;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); animation: slideDown 0.4s ease;
    }
    @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .fav-banner-icon { font-size: 22px; margin-right: 10px; }
    .fav-banner-info { flex: 1; }
    .fav-banner-title { font-size: 10px; font-weight: 900; color: #996B00; display: block; letter-spacing: 0.5px; }
    .fav-banner-sub { font-size: 12px; font-weight: 700; color: #4A3B00; }
    .fav-banner-action { border: none; background: #FFC700; color: #4A3B00; font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 10px; cursor: pointer; }

    /* Scroll Area */
    .ios-scroll-area { flex: 1; overflow-y: auto; padding: 16px 14px 85px; -webkit-overflow-scrolling: touch; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Blow Your Mind Hero Headline Match Card */
    .headline-hero {
        background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
        border-radius: 22px; padding: 18px; margin-bottom: 14px;
        border: 1px solid rgba(0, 122, 255, 0.15); box-shadow: 0 10px 30px rgba(0, 122, 255, 0.08);
        text-align: center; position: relative;
    }
    .card-status-pill { font-size: 10px; font-weight: 800; color: var(--ios-subtext); letter-spacing: 0.5px; }
    .pill-live { color: var(--ios-red); display: inline-flex; align-items: center; gap: 4px; }

    .match-board { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px; }
    .team-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .hero-badge {
        width: 44px; height: 44px; border-radius: 50%; background: #F0F6FF;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 13px; color: var(--ios-blue);
        border: 2px solid #D0E3FF; position: relative; box-shadow: 0 4px 10px rgba(0,122,255,0.1);
    }

    .star-btn-corner {
        position: absolute; top: -4px; right: -4px; background: #FFF; border: 1px solid var(--ios-border);
        border-radius: 50%; width: 18px; height: 18px; font-size: 9px; color: #CCC;
        display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    }
    .star-btn-corner.active { color: var(--ios-gold); background: #FFF; border-color: var(--ios-gold); box-shadow: 0 0 8px var(--ios-gold-glow); }

    .fav-inline-star { color: #CCC; font-size: 12px; margin: 0 2px; display: none; }
    .fav-inline-star.active { color: var(--ios-gold); display: inline-block; }

    .team-name { font-weight: 800; font-size: 13px; text-align: center; }

    .score-display { font-size: 28px; font-weight: 900; color: var(--ios-blue); display: flex; gap: 6px; align-items: center; }
    .vs-circle-hero {
        width: 30px; height: 30px; border-radius: 50%; background: var(--ios-bg);
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 900; color: var(--ios-subtext); border: 1px solid var(--ios-border);
    }
    .match-time-tag { font-size: 11px; font-weight: 700; color: var(--ios-subtext); margin-top: 4px; }

    /* Momentum Bar */
    .momentum-bar-wrap { margin-top: 14px; padding-top: 10px; border-top: 0.5px solid var(--ios-border); }
    .momentum-title { font-size: 9px; font-weight: 800; color: var(--ios-subtext); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .momentum-track { height: 6px; background: var(--ios-bg); border-radius: 3px; display: flex; overflow: hidden; }
    .momentum-fill { height: 100%; transition: width 0.3s ease; }
    .home-fill { background: var(--ios-blue); }
    .away-fill { background: var(--ios-green); }

    /* Hero Fan Poll Widget */
    .hero-poll-box {
        margin-top: 14px; background: rgba(0, 122, 255, 0.04);
        border: 1px solid rgba(0, 122, 255, 0.1); border-radius: 14px; padding: 10px;
    }
    .poll-header { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: var(--ios-subtext); margin-bottom: 8px; }
    .poll-options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .poll-btn {
        position: relative; border: 1px solid var(--ios-border); background: #FFF;
        padding: 8px 4px; border-radius: 10px; font-size: 11px; font-weight: 800;
        cursor: pointer; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .poll-bar { position: absolute; left: 0; bottom: 0; top: 0; background: rgba(0, 122, 255, 0.15); pointer-events: none; transition: width 0.4s ease; }
    .poll-team-label { z-index: 2; position: relative; }
    .poll-percent { font-size: 9px; color: var(--ios-subtext); z-index: 2; position: relative; }

    /* KPI Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .kpi-card { background: var(--ios-card); padding: 12px 8px; border-radius: 16px; text-align: center; border: 0.5px solid var(--ios-border); }
    .kpi-icon { font-size: 14px; display: block; margin-bottom: 2px; }
    .kpi-value { font-size: 17px; font-weight: 800; color: var(--ios-text); display: block; }
    .kpi-label { font-size: 10px; color: var(--ios-subtext); font-weight: 600; }

    /* Date Pills Scroll Bar */
    .date-pills-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
    .date-pills-bar::-webkit-scrollbar { display: none; }
    .date-pill {
        border: none; background: var(--ios-card); color: var(--ios-text);
        padding: 7px 14px; border-radius: 20px; font-size: 11px; font-weight: 700;
        white-space: nowrap; border: 0.5px solid var(--ios-border); cursor: pointer;
        transition: all 0.2s ease;
    }
    .date-pill.active { background: var(--ios-blue); color: #FFF; border-color: var(--ios-blue); box-shadow: 0 3px 10px var(--ios-blue-glow); }
    .fav-pill.active { background: #FFC700; color: #3A2B00; border-color: #FFC700; box-shadow: 0 3px 10px var(--ios-gold-glow); }

    /* Segmented Control */
    .ios-segmented-control { display: flex; background: rgba(120, 120, 128, 0.12); padding: 3px; border-radius: 12px; margin-bottom: 14px; }
    .seg-btn {
        flex: 1; border: none; background: transparent; padding: 8px 0;
        font-size: 12px; font-weight: 600; color: var(--ios-text);
        border-radius: 9px; cursor: pointer; transition: all 0.2s ease;
    }
    .seg-btn.active { background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.08); color: var(--ios-blue); font-weight: 700; }

    .subtab-content { display: none; }
    .subtab-content.active { display: block; }

    /* Cards & Lists */
    .ios-card {
        background: var(--ios-card); border-radius: 18px; padding: 14px;
        margin-bottom: 12px; border: 0.5px solid var(--ios-border); box-shadow: var(--ios-card-shadow);
    }
    .ios-card-header { font-size: 11px; font-weight: 800; color: var(--ios-subtext); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }

    .match-row-compact { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; }
    .score-pill, .r-score-pill { background: var(--ios-bg); color: var(--ios-blue); font-weight: 800; padding: 4px 10px; border-radius: 12px; font-size: 12px; }

    .fixture-item, .result-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 0; border-bottom: 0.5px solid var(--ios-border); font-size: 13px;
    }
    .fixture-item:last-child, .result-item:last-child { border-bottom: none; }
    .f-date-badge { font-size: 10px; font-weight: 700; color: var(--ios-blue); background: rgba(0,122,255,0.08); padding: 4px 8px; border-radius: 8px; }

    /* Table & Qualification Highlight */
    .ios-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ios-table th { text-align: left; color: var(--ios-subtext); padding-bottom: 8px; font-size: 10px; text-transform: uppercase; }
    .ios-table td { padding: 10px 0; border-bottom: 0.5px solid var(--ios-border); }
    .pos-col { color: var(--ios-subtext); font-weight: 700; width: 22px; }
    .pts-cell { font-weight: 800; color: var(--ios-text); }
    .text-right { text-align: right; }
    tr.qualified-row td { border-left: 3px solid var(--ios-green); padding-left: 6px; }

    /* Search Input */
    .search-box-wrap { position: relative; margin-bottom: 12px; }
    .search-icon { position: absolute; left: 12px; top: 10px; width: 15px; height: 15px; color: var(--ios-subtext); }
    .ios-search-input {
        width: 100%; padding: 9px 10px 9px 34px; border-radius: 12px;
        border: 0.5px solid var(--ios-border); background: var(--ios-bg);
        font-size: 12px; outline: none; font-weight: 600;
    }

    .clickable { cursor: pointer; transition: opacity 0.15s ease; }
    .clickable:active { opacity: 0.6; }

    /* Dynamic Team Profile Drawer Modal */
    .drawer-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
        z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .drawer-backdrop.active { opacity: 1; pointer-events: auto; }

    .team-drawer {
        position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF;
        border-top-left-radius: 24px; border-top-right-radius: 24px;
        padding: 12px 18px 30px; z-index: 201; transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        max-height: 80vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
    }
    .team-drawer.active { transform: translateY(0); }
    .drawer-handle { width: 36px; height: 4px; background: #D1D1D6; border-radius: 2px; margin: 0 auto 12px; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .drawer-badge { font-size: 9px; font-weight: 800; color: var(--ios-blue); background: rgba(0,122,255,0.1); padding: 3px 8px; border-radius: 8px; }

    .drawer-star-toggle {
        border: none; background: var(--ios-bg); color: var(--ios-subtext);
        font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .drawer-star-toggle.active { background: #FFF3CC; color: #996B00; border: 1px solid var(--ios-gold); }

    .drawer-title { font-size: 18px; font-weight: 800; margin: 0; }
    .drawer-close-btn { border: none; background: var(--ios-bg); border-radius: 50%; width: 26px; height: 26px; font-weight: 800; color: var(--ios-subtext); cursor: pointer; }

    .form-dot { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: #FFF; margin-right: 4px; }
    .form-W { background: var(--ios-green); }
    .form-D { background: var(--ios-orange); }
    .form-L { background: var(--ios-red); }

    .lb-view { display: none; }
    .lb-view.active { display: block; }

    /* Bottom Tab Bar */
    .ios-tab-bar {
        position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
        background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
        border-top: 0.5px solid var(--ios-border); display: flex; justify-content: space-around;
        align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
    }
    .tab-item { border: none; background: transparent; display: flex; flex-direction: column; align-items: center; color: var(--ios-subtext); width: 25%; cursor: pointer; }
    .tab-icon-wrap { width: 20px; height: 20px; position: relative; margin-bottom: 2px; }
    .tab-icon-wrap svg { width: 100%; height: 100%; position: absolute; top:0; left:0; }
    .icon-filled { display: none; }
    .tab-item.active { color: var(--ios-blue); }
    .tab-item.active .icon-filled { display: block; }
    .tab-item.active .icon-outline { display: none; }
    .tab-label { font-size: 10px; font-weight: 600; }
    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .pg-btn { border: none; background: var(--ios-bg); padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: var(--ios-blue); }
    .empty-state { font-size: 11px; color: var(--ios-subtext); text-align: center; margin: 10px 0; }
</style>
