<script>
 // ============================================================
// STATE MANAGEMENT

let currentPage = 1;
const itemsPerPage = 5;
let filteredTeams = [...ALL_TEAMS_DATA];
let activeModalTeamId = null;
let selectedDateFilter = null;
let currentDateStripOffset = 0;
let pollUpdateInterval = null;
let activeFixtureId = null;

let modalState = {
    isOpen: false,
    teamId: null,

function openFixtureModal(fixtureId) {
    activeFixtureId = fixtureId;
    const fixture = ALL_FIXTURES_DATA.find(f => f.id == fixtureId);
    if (!fixture) return;

    document.getElementById('modalFixtureTitle').innerText = `${fixture.home_team_name} vs ${fixture.away_team_name}`;

    const content = document.getElementById('modalFixtureContent');
    const dateLabel = fixture.match_date ? formatMatchDate(fixture.match_date) : 'TBD';
    const timeLabel = (fixture.match_time && fixture.match_time !== 'TBD') ? fixture.match_time : '';
    const played = fixture.is_played;

    content.innerHTML = `
        <div class="fixture-detail-card">
            <div class="fixture-detail-teams">
                <div class="fixture-detail-team" onclick="openTeamModal(${fixture.home_team_id})">
                    <div class="fixture-detail-crest">${fixture.home_team_name.charAt(0)}</div>
                    <span class="fixture-detail-name">${fixture.home_team_name}</span>
                    ${played ? `<span class="fixture-detail-score">${fixture.home_score}</span>` : ''}
                </div>
                <div class="fixture-detail-vs">VS</div>
                <div class="fixture-detail-team" onclick="openTeamModal(${fixture.away_team_id})">
                    <div class="fixture-detail-crest">${fixture.away_team_name.charAt(0)}</div>
                    <span class="fixture-detail-name">${fixture.away_team_name}</span>
                    ${played ? `<span class="fixture-detail-score">${fixture.away_score}</span>` : ''}
                </div>
            </div>

            <div class="fixture-detail-info">
                <div class="fixture-detail-row">
                    <span class="fixture-detail-label">Date</span>
                    <span class="fixture-detail-value">${dateLabel}</span>
                </div>
                ${timeLabel ? `<div class="fixture-detail-row"><span class="fixture-detail-label">Time</span><span class="fixture-detail-value">${timeLabel}</span></div>` : ''}
                ${fixture.stage ? `<div class="fixture-detail-row"><span class="fixture-detail-label">Stage</span><span class="fixture-detail-value phase-badge-mini phase-${fixture.stage_css}">${fixture.stage}</span></div>` : ''}
                ${fixture.group ? `<div class="fixture-detail-row"><span class="fixture-detail-label">Group</span><span class="fixture-detail-value">${fixture.group}</span></div>` : ''}
                <div class="fixture-detail-row">
                    <span class="fixture-detail-label">Status</span>
                    <span class="fixture-detail-value">
                        ${played ? '<span class="ios-badge ios-badge-success">Played</span>' :
                          fixture.is_live ? '<span class="ios-badge ios-badge-warning">Live</span>' :
                          '<span class="ios-badge ios-badge-secondary">Upcoming</span>'}
                    </span>
                </div>
            </div>

            ${played ? `
            <div class="fixture-detail-result">
                <div class="fixture-detail-result-title">Match Result</div>
                <div class="fixture-detail-result-score">
                    <span class="fixture-detail-result-home">${fixture.home_team_name} ${fixture.home_score}</span>
                    <span class="fixture-detail-result-vs">-</span>
                    <span class="fixture-detail-result-away">${fixture.away_score} ${fixture.away_team_name}</span>
                </div>
            </div>` : ''}

            <div class="fixture-detail-actions">
                <button class="btn btn-ios-secondary btn-sm" onclick="closeFixtureModal()">Close</button>
                <button class="btn btn-ios-primary btn-sm" onclick="openTeamModal(${fixture.home_team_id})">View Home Team</button>
                <button class="btn btn-ios-primary btn-sm" onclick="openTeamModal(${fixture.away_team_id})">View Away Team</button>
            </div>
        </div>
    `;

    document.getElementById('fixtureDrawerBackdrop').classList.add('active');
    document.getElementById('fixtureDrawerModal').classList.add('active');
}

function closeFixtureModal() {
    activeFixtureId = null;
    document.getElementById('fixtureDrawerBackdrop').classList.remove('active');
    document.getElementById('fixtureDrawerModal').classList.remove('active');
}

// ============================================================
// FAVORITES ENGINE
// ============================================================
function getFavorites() {
    const favs = localStorage.getItem('fav_teams_ids');
    return favs ? JSON.parse(favs) : [];
}

function saveFavorites(favArray) {
    localStorage.setItem('fav_teams_ids', JSON.stringify(favArray));
    syncAllFavoritesUI();
}

function toggleFavorite(teamId) {
    let favs = getFavorites();
    if (favs.includes(teamId)) {
        favs = favs.filter(id => id !== teamId);
    } else {
        favs.push(teamId);
    }
    saveFavorites(favs);
}

// ============================================================
// COMPACT FAVORITE TEAMS CAROUSEL
// ============================================================
function renderFavoritesCarousel() {
    const track = document.getElementById('favCarouselTrack');
    const favs = getFavorites();

    if (!track) return;

    if (favs.length === 0) {
        track.innerHTML = `
            <div class="fav-team-card" onclick="openFavSelector()" style="min-width: 120px;">
                <div class="fav-crest" style="background: linear-gradient(135deg, #CCC, #AAA);">+</div>
                <div class="fav-team-name">Add Favorites</div>
            </div>
        `;
        return;
    }

    const favTeams = ALL_TEAMS_DATA.filter(t => favs.includes(t.id));
    const today = new Date().toISOString().split('T')[0];

    favTeams.sort((a, b) => {
        const aPlaying = isTeamPlayingToday(a.id, today);
        const bPlaying = isTeamPlayingToday(b.id, today);
        if (aPlaying && !bPlaying) return -1;
        if (!aPlaying && bPlaying) return 1;
        return a.name.localeCompare(b.name);
    });

    track.innerHTML = favTeams.map(team => {
        const form = getTeamFormGuide(team.name);
        const formHtml = form.slice(0, 3).map(r =>
            `<span class="form-indicator form-${r}">${r}</span>`
        ).join('');

        const isPlayingToday = isTeamPlayingToday(team.id, today);
        const nextMatch = findNextMatch(team.id);

        return `
            <div class="fav-team-card favorite ${isPlayingToday ? 'playing-today' : ''}"
                 onclick="openTeamModal(${team.id})">
                ${isPlayingToday ? '<span class="playing-badge">TODAY</span>' : ''}
                <div class="fav-crest">${team.name.charAt(0)}</div>
                <div class="fav-team-name">${team.name}</div>
                <div class="fav-form-guide">${formHtml || '<span style="font-size:8px;color:var(--ios-subtext)">-</span>'}</div>
                ${nextMatch ? `<div class="fav-next-match">${isPlayingToday ? 'Today' : formatMatchDate(nextMatch.match_date)}</div>` : ''}
            </div>
        `;
    }).join('');
}

function isTeamPlayingToday(teamId, today) {
    if (!window.ALL_FIXTURES_DATA) return false;
    return ALL_FIXTURES_DATA.some(f =>
        f.match_date === today && (f.home_team_id === teamId || f.away_team_id === teamId)
    );
}

function getTeamFormGuide(teamName) {
    if (!window.ALL_RESULTS_DATA || ALL_RESULTS_DATA.length === 0) {
        return [];
    }

    const results = ALL_RESULTS_DATA.filter(r =>
        r.home_team === teamName || r.away_team === teamName
    ).slice(-3);

    return results.map(r => {
        const isHome = r.home_team === teamName;
        const myScore = isHome ? r.home_score : r.away_score;
        const oppScore = isHome ? r.away_score : r.home_score;
        return myScore > oppScore ? 'W' : (myScore === oppScore ? 'D' : 'L');
    });
}

function findNextMatch(teamId) {
    if (!window.ALL_FIXTURES_DATA) return null;
    return ALL_FIXTURES_DATA.find(f =>
        f.home_team_id === teamId || f.away_team_id === teamId
    );
}

function openFavSelector() {
    const backdrop = document.getElementById('favSelectorBackdrop');
    const modal = document.getElementById('favSelectorModal');
    const list = document.getElementById('favSelectorList');
    const favs = getFavorites();

    if (!backdrop || !modal || !list) return;

    list.innerHTML = ALL_TEAMS_DATA.map(team => {
        const isFav = favs.includes(team.id);
        return `
            <div class="fav-selector-item ${isFav ? 'selected' : ''}"
                 onclick="toggleFavorite(${team.id}); this.classList.toggle('selected');">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="team-mini-crest">${team.name.charAt(0)}</div>
                    <span style="font-weight:700;font-size:13px;">${team.name}</span>
                </div>
                <span style="font-size:18px;">${isFav ? '\u2b50' : '\u2606'}</span>
            </div>
        `;
    }).join('');

    backdrop.classList.add('active');
    modal.classList.add('active');
}

function closeFavSelector() {
    const backdrop = document.getElementById('favSelectorBackdrop');
    const modal = document.getElementById('favSelectorModal');
    if (backdrop) backdrop.classList.remove('active');
    if (modal) modal.classList.remove('active');
    syncAllFavoritesUI();
}

// ============================================================
// FREE-SCROLLING DATE STRIP
// ============================================================

function buildDateStrip() {
    const track = document.getElementById('dateStripTrack');
    const viewport = document.getElementById('dateStripViewport');

    if (!track || !viewport || !window.ALL_FIXTURES_DATA) return;

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    const chips = [];
    for (let i = -7; i < 23; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
        const dayNum = d.getDate();
        const monthName = d.toLocaleDateString('en-US', { month: 'short' });
        const isToday = dateStr === todayStr;

        const matchCount = ALL_FIXTURES_DATA.filter(f => f.match_date === dateStr).length;

        chips.push({
            dateStr,
            dayName,
            dayNum,
            monthName,
            isToday,
            matchCount
        });
    }

    track.innerHTML = chips.map(chip => `
        <div class="date-chip ${chip.isToday ? 'today' : ''} ${selectedDateFilter === chip.dateStr ? 'selected' : ''}"
             data-date="${chip.dateStr}"
             data-is-today="${chip.isToday}"
             onclick="selectDate('${chip.dateStr}', this)">
            <span class="date-chip-day">${chip.dayName}</span>
            <span class="date-chip-date">${chip.dayNum}</span>
            <span class="date-chip-month">${chip.monthName}</span>
            ${chip.matchCount > 0 ? `<span class="date-chip-count">${chip.matchCount}</span>` : ''}
        </div>
    `).join('');

    enableMomentumScroll(viewport);
    setTimeout(() => scrollToToday(false), 200);
    selectDate(todayStr, track.querySelector('[data-is-today="true"]'));
}

function enableMomentumScroll(viewport) {
    let isDown = false;
    let startX;
    let scrollLeft;
    let velocity = 0;
    let momentumID;

    viewport.addEventListener('mousedown', (e) => {
        isDown = true;
        viewport.style.cursor = 'grabbing';
        startX = e.pageX - viewport.offsetLeft;
        scrollLeft = viewport.scrollLeft;
        cancelMomentum();
    });

    viewport.addEventListener('mouseleave', () => {
        isDown = false;
        viewport.style.cursor = 'grab';
        startMomentum();
    });

    viewport.addEventListener('mouseup', () => {
        isDown = false;
        viewport.style.cursor = 'grab';
        startMomentum();
    });

    viewport.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - viewport.offsetLeft;
        const walk = (x - startX) * 1.5;
        velocity = walk;
        viewport.scrollLeft = scrollLeft - walk;
    });

    viewport.addEventListener('touchstart', (e) => {
        startX = e.touches[0].pageX - viewport.offsetLeft;
        scrollLeft = viewport.scrollLeft;
        cancelMomentum();
    });

    viewport.addEventListener('touchend', () => {
        startMomentum();
    });

    viewport.addEventListener('touchmove', (e) => {
        const x = e.touches[0].pageX - viewport.offsetLeft;
        const walk = (x - startX) * 1.5;
        velocity = walk;
        viewport.scrollLeft = scrollLeft - walk;
    });

    function startMomentum() {
        cancelMomentum();
        if (Math.abs(velocity) < 2) return;
        momentumID = requestAnimationFrame(animateMomentum);
    }

    function animateMomentum() {
        velocity *= 0.95;
        viewport.scrollLeft -= velocity;
        if (Math.abs(velocity) > 0.5) {
            momentumID = requestAnimationFrame(animateMomentum);
        }
    }

    function cancelMomentum() {
        if (momentumID) {
            cancelAnimationFrame(momentumID);
            momentumID = null;
        }
        velocity = 0;
    }
}

function scrollToToday(animate = true) {
    const track = document.getElementById('dateStripTrack');
    const viewport = document.getElementById('dateStripViewport');
    if (!track || !viewport) return;

    const todayChip = track.querySelector('[data-is-today="true"]');
    if (todayChip) {
        const scrollTo = todayChip.offsetLeft - (viewport.offsetWidth / 2) + (todayChip.offsetWidth / 2);
        if (animate) {
            viewport.scrollTo({ left: Math.max(0, scrollTo), behavior: 'smooth' });
        } else {
            viewport.scrollLeft = Math.max(0, scrollTo);
        }
        selectDate(todayChip.dataset.date, todayChip);
    }
}

function slideDateStrip(direction) {
    const viewport = document.getElementById('dateStripViewport');
    if (!viewport) return;
    const scrollAmount = 180;
    viewport.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

function selectDate(dateStr, element) {
    selectedDateFilter = dateStr;

    document.querySelectorAll('.date-chip').forEach(chip => {
        chip.classList.remove('selected');
        if (chip.dataset.date === dateStr) {
            chip.classList.add('selected');
        }
    });

    const display = document.getElementById('selectedDateDisplay');
    if (display) {
        const d = new Date(dateStr + 'T00:00:00');
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];

        let formatted;
        if (dateStr === todayStr) {
            formatted = "Today's Matches";
        } else {
            formatted = d.toLocaleDateString('en-US', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });
        }

        const matches = ALL_FIXTURES_DATA.filter(f => f.match_date === dateStr);
        display.querySelector('.selected-date-text').textContent = formatted;
        display.querySelector('.match-count-badge').textContent = `${matches.length} matches`;
    }

    filterFixturesBySelectedDate(dateStr);
}

function centerOnToday() {
    scrollToToday(true);
}

function filterFixturesBySelectedDate(dateStr) {
    const rows = document.querySelectorAll('.fixture-card-row');
    let visibleCount = 0;
    const favs = getFavorites();

    rows.forEach(row => {
        const rowDate = row.getAttribute('data-date');
        if (rowDate === dateStr) {
            row.style.display = 'flex';
            visibleCount++;
            const homeId = parseInt(row.getAttribute('data-home-id'));
            const awayId = parseInt(row.getAttribute('data-away-id'));
            if (favs.includes(homeId) || favs.includes(awayId)) {
                row.style.order = '-1';
                row.style.background = 'rgba(255, 215, 0, 0.05)';
            } else {
                row.style.order = '0';
                row.style.background = '';
            }
        } else {
            row.style.display = 'none';
        }
    });

    const badge = document.getElementById('matchCountBadge');
    if (badge) {
        badge.textContent = `${visibleCount} matches`;
    }
}

// ============================================================
// REAL-TIME POLL WITH BACKEND
// ============================================================
let currentFixtureId = null;

function initializePoll() {
    const pollWidget = document.getElementById('matchPollWidget');
    if (pollWidget) {
        currentFixtureId = pollWidget.getAttribute('data-fixture-id');
        fetchPollResults();
        if (pollUpdateInterval) clearInterval(pollUpdateInterval);
        pollUpdateInterval = setInterval(fetchPollResults, 10000);
    }

    const voted = localStorage.getItem(`poll_voted_${currentFixtureId}`);
    if (voted) {
        highlightVotedOption(voted);
    }
}

async function fetchPollResults() {
    if (!currentFixtureId) return;
    try {
        const response = await fetch(`/api/poll/${currentFixtureId}/results/`);
        const data = await response.json();
        renderPollFromData(data);
    } catch (e) {
        console.log('Using local poll data');
    }
}

function renderPollFromData(data) {
    if (!document.getElementById('matchPollWidget')) return;
    const total = data.total || 1;

    const hPct = data.home_pct || 0;
    const dPct = data.draw_pct || 0;
    const aPct = data.away_pct || 0;

    const voteCountEl = document.getElementById('pollVoteCount');
    if (voteCountEl) voteCountEl.innerText = `${data.total || 0} votes`;

    const barHome = document.getElementById('barHome');
    const pctHome = document.getElementById('pctHome');
    const barDraw = document.getElementById('barDraw');
    const pctDraw = document.getElementById('pctDraw');
    const barAway = document.getElementById('barAway');
    const pctAway = document.getElementById('pctAway');

    if (barHome) barHome.style.width = `${hPct}%`;
    if (pctHome) pctHome.innerText = `${hPct}%`;
    if (barDraw) barDraw.style.width = `${dPct}%`;
    if (pctDraw) pctDraw.innerText = `${dPct}%`;
    if (barAway) barAway.style.width = `${aPct}%`;
    if (pctAway) pctAway.innerText = `${aPct}%`;

    const maxPct = Math.max(hPct, dPct, aPct);
    ['barHome', 'barDraw', 'barAway'].forEach(id => {
        const bar = document.getElementById(id);
        if (bar) {
            const pct = parseInt(bar.style.width);
            bar.style.background = pct === maxPct ?
                'rgba(0, 122, 255, 0.25)' : 'rgba(0, 122, 255, 0.1)';
        }
    });
}

async function castPollVote(choice) {
    const hasVoted = localStorage.getItem(`poll_voted_${currentFixtureId}`);
    if (hasVoted) {
        showPollMessage('You have already voted!');
        return;
    }

    if (!currentFixtureId) {
        showPollMessage('No active poll');
        return;
    }

    try {
        const response = await fetch(`/api/poll/${currentFixtureId}/vote/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken(),
            },
            body: JSON.stringify({ choice: choice })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem(`poll_voted_${currentFixtureId}`, choice);
            renderPollFromData(data.current);
            highlightVotedOption(choice);
            showPollMessage('Vote recorded!');
        } else if (response.status === 409) {
            localStorage.setItem(`poll_voted_${currentFixtureId}`, choice);
            renderPollFromData(data.current);
            highlightVotedOption(choice);
            showPollMessage('Already voted! Showing results');
        } else {
            showPollMessage('Error recording vote. Try again.');
        }
    } catch (e) {
        showPollMessage('Network error. Try again.');
        console.error('Poll vote error:', e);
    }
}

function getCsrfToken() {
    const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
    return cookie ? cookie.split('=')[1] : '';
}

function highlightVotedOption(choice) {
    const buttons = document.querySelectorAll('.poll-btn');
    buttons.forEach(btn => btn.classList.remove('voted'));

    const choiceMap = { home: 0, draw: 1, away: 2 };
    if (choiceMap[choice] !== undefined && buttons[choiceMap[choice]]) {
        buttons[choiceMap[choice]].classList.add('voted');
    }
}

function showPollMessage(msg) {
    const el = document.getElementById('pollVoterMessage');
    if (el) {
        el.textContent = msg;
        setTimeout(() => { el.textContent = ''; }, 3000);
    }
}

// ============================================================
// TAB NAVIGATION
// ============================================================
function switchMainTab(tabName, element) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));

    const tab = document.getElementById(`tab-${tabName}`);
    if (tab) tab.classList.add('active');
    if (element) element.classList.add('active');

    if (tabName === 'standings') {
        requestAnimationFrame(updateStickyStandingsOffsets);
    }
}


function switchLeaderboard(lbName, element) {
    document.querySelectorAll('.lb-view').forEach(el => el.classList.remove('active'));
    element.parentElement.querySelectorAll('.seg-btn').forEach(btn => btn.classList.remove('active'));

    const lb = document.getElementById(`lb-${lbName}`);
    if (lb) lb.classList.add('active');
    element.classList.add('active');
}

// ============================================================
// STANDINGS PHASE SWITCHING
// ============================================================

function switchStandingsPhase(phase, element) {
    document.querySelectorAll('.phase-nav-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    if (element) element.classList.add('active');

    document.querySelectorAll('.standings-phase-content').forEach(content => {
        content.classList.remove('active');
    });
    const target = document.getElementById(`standings-phase-${phase}`);
    if (target) target.classList.add('active');

    requestAnimationFrame(updateStickyStandingsOffsets);
}

// ============================================================
// TEAM MODAL
// ============================================================
function getTeamFixtures(teamId) {
    if (!window.ALL_FIXTURES_DATA) return [];
    return ALL_FIXTURES_DATA
        .filter(f => f.home_team_id === teamId || f.away_team_id === teamId)
        .slice()
        .sort((a, b) => (a.match_date || '9999-99-99').localeCompare(b.match_date || '9999-99-99'));
}

function findTeamIdByName(name) {
    const t = ALL_TEAMS_DATA.find(t => t.name === name);
    return t ? t.id : null;
}

function buildTeamFixturesHtml(team) {
    const fixtures = getTeamFixtures(team.id);
    if (fixtures.length === 0) {
        return '<p class="empty-state">No upcoming fixtures scheduled</p>';
    }
    return fixtures.map(f => {
        const isHome = f.home_team_id === team.id;
        const oppName = isHome ? f.away_team_name : f.home_team_name;
        const oppId = isHome ? f.away_team_id : f.home_team_id;
        const dateLabel = f.match_date ? formatMatchDate(f.match_date) : 'TBD';
        const timeLabel = (f.match_time && f.match_time !== 'TBD') ? f.match_time : '';
        return `
            <div class="modal-list-row clickable" onclick="openTeamModal(${oppId})">
                <div class="modal-list-main">
                    <span class="modal-list-tag">${isHome ? 'HOME' : 'AWAY'}</span>
                    <span class="modal-list-opponent">vs ${oppName}</span>
                    ${f.group ? `<span class="group-badge">${f.group}</span>` : ''}
                </div>
                <div class="modal-list-meta">${dateLabel}${timeLabel ? ' \u00b7 ' + timeLabel : ''}</div>
            </div>
        `;
    }).join('');
}

function buildTeamResultsHtml(team) {
    if (!window.ALL_RESULTS_DATA) return '<p class="empty-state">No results recorded yet</p>';
    const rows = ALL_RESULTS_DATA.filter(r => r.home_team === team.name || r.away_team === team.name);
    if (rows.length === 0) {
        return '<p class="empty-state">No results recorded yet</p>';
    }
    return rows.map(r => {
        const isHome = r.home_team === team.name;
        const oppName = isHome ? r.away_team : r.home_team;
        const myScore = isHome ? r.home_score : r.away_score;
        const oppScore = isHome ? r.away_score : r.home_score;
        const outcome = myScore > oppScore ? 'W' : (myScore === oppScore ? 'D' : 'L');
        const oppId = findTeamIdByName(oppName);
        return `
            <div class="modal-list-row ${oppId ? 'clickable' : ''}" ${oppId ? `onclick="openTeamModal(${oppId})"` : ''}>
                <div class="modal-list-main">

// ---- NEW: team-detail helpers (badges / biggest results / sparkline) ----

function computeTeamBadges(team) {
    const badges = [];
    if (!window.ALL_TEAMS_DATA || team.played === 0) return badges;

    const byPoints = [...ALL_TEAMS_DATA].sort((a, b) => b.points - a.points);
    if (byPoints[0] && byPoints[0].id === team.id) {
        badges.push({ label: 'League Leader', cls: 'badge-gold' });
    }
    const byGoals = [...ALL_TEAMS_DATA].sort((a, b) => b.goals_for - a.goals_for);
    if (byGoals[0] && byGoals[0].id === team.id && team.goals_for > 0) {
        badges.push({ label: 'Top Scorer', cls: 'badge-blue' });
    }
    const byDefense = [...ALL_TEAMS_DATA].filter(t => t.played > 0).sort((a, b) => a.goals_against - b.goals_against);
    if (byDefense[0] && byDefense[0].id === team.id) {
        badges.push({ label: 'Best Defense', cls: 'badge-green' });
    }

    const last5 = getTeamFormGuide(team.name).slice(-5);
    const wins = last5.filter(r => r === 'W').length;
    const losses = last5.filter(r => r === 'L').length;
    if (wins >= 3) badges.push({ label: 'In Form', cls: 'badge-fire' });
    if (losses >= 3) badges.push({ label: 'Cold Streak', cls: 'badge-cold' });

    return badges;
}

function computeBiggestResults(team) {
    if (!window.ALL_RESULTS_DATA) return { win: null, loss: null };
    let biggestWin = null, biggestLoss = null;

    ALL_RESULTS_DATA.forEach(r => {
        const isHome = r.home_team === team.name;
        const isAway = r.away_team === team.name;
        if (!isHome && !isAway) return;

        const my = isHome ? r.home_score : r.away_score;
        const opp = isHome ? r.away_score : r.home_score;
        const oppName = isHome ? r.away_team : r.home_team;
        const margin = my - opp;

        if (margin > 0 && (!biggestWin || margin > biggestWin.margin)) {
            biggestWin = { margin, text: `${my}-${opp} vs ${oppName}` };
        }
        if (margin < 0 && (!biggestLoss || margin < biggestLoss.margin)) {
            biggestLoss = { margin, text: `${my}-${opp} vs ${oppName}` };
        }
    });

    return { win: biggestWin, loss: biggestLoss };
}

function buildGoalsSparkline(team) {
    if (!window.ALL_RESULTS_DATA) return '';
    const matches = ALL_RESULTS_DATA
        .filter(r => r.home_team === team.name || r.away_team === team.name)
        .slice()
        .reverse(); // ALL_RESULTS_DATA is newest-first; sparkline reads left-to-right chronologically

    if (matches.length < 2) return '';

    const goals = matches.map(r => r.home_team === team.name ? r.home_score : r.away_score);
    const maxGoal = Math.max(...goals, 1);
    const w = 300, h = 40, pad = 4;
    const step = (w - pad * 2) / (goals.length - 1);

    const points = goals.map((g, i) => {
        const x = pad + i * step;
        const y = h - pad - (g / maxGoal) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    return `<svg viewBox="0 0 ${w} ${h}" class="sparkline" preserveAspectRatio="none">
        <polyline points="${points}" fill="none" stroke="var(--ios-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

function setupCylinderPadding() {
    const viewport = document.getElementById('dateStripViewport');
    const track = document.getElementById('dateStripTrack');
    if (!viewport || !track) return;
    const firstChip = track.querySelector('.date-chip');
    if (!firstChip) return;
    const chipWidth = firstChip.getBoundingClientRect().width;
    const pad = Math.max(0, (viewport.clientWidth / 2) - (chipWidth / 2));
    track.style.paddingLeft = pad + 'px';
    track.style.paddingRight = pad + 'px';
}

function applyCylinderEffect() {
    const viewport = document.getElementById('dateStripViewport');
    const track = document.getElementById('dateStripTrack');
    if (!viewport || !track) return;

    const chips = track.querySelectorAll('.date-chip');
    const viewportRect = viewport.getBoundingClientRect();
    const centerX = viewportRect.left + viewportRect.width / 2;

    let focalChip = null;
    let focalDist = Infinity;

    chips.forEach(chip => {
        const rect = chip.getBoundingClientRect();
        const chipCenter = rect.left + rect.width / 2;

        const raw = (chipCenter - centerX) / (viewportRect.width / 2 || 1);
        const clamped = Math.max(-1.7, Math.min(1.7, raw));
        const absD = Math.abs(clamped);

        const scale = Math.max(0.6, 1 - absD * 0.32);
        const rotateY = clamped * -30;
        const translateZ = -absD * 90;
        const translateY = absD * 6;
        const opacity = Math.max(0.32, 1 - absD * 0.58);
        const blur = absD > 0.85 ? Math.min(2.2, (absD - 0.85) * 6) : 0;

        chip.style.transform =
            `translateY(${translateY}px) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
        chip.style.opacity = opacity;
        chip.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
        chip.style.zIndex = Math.round((1 - absD) * 100);

        if (absD < focalDist) {
            focalDist = absD;
            focalChip = chip;
        }
    });

    chips.forEach(chip => chip.classList.remove('cyl-focal'));
    if (focalChip && focalDist < 0.22) {
        focalChip.classList.add('cyl-focal');
    }
}

            .sort((a, b) => b.goals_for - a.goals_for)
            .map((t, i) => row(t, i, t.goals_for)).join('');

            .sort((a, b) => b.wins - a.wins)

function renderHeroCard(data, nameToId) {
    const heroSection = document.getElementById('heroSection');
    if (!heroSection) return;

    if (data.live) {
        if (pollUpdateInterval) { clearInterval(pollUpdateInterval); pollUpdateInterval = null; }
        currentFixtureId = null;

        const homeId = nameToId[data.live.home_team] ?? null;
        const awayId = nameToId[data.live.away_team] ?? null;

        const goalScored = previousLiveScore &&
            previousLiveScore.home_team === data.live.home_team &&
            previousLiveScore.away_team === data.live.away_team &&
            (previousLiveScore.home_score !== data.live.home_score ||
             previousLiveScore.away_score !== data.live.away_score);

        const total = data.live.home_score + data.live.away_score;
        const homePct = total > 0 ? Math.round((data.live.home_score / total) * 100) : 50;
        const pulseClass = goalScored ? 'pulse-goal' : '';
        const stageSuffix = data.live.stage ? ` &middot; ${data.live.stage.toUpperCase()}` : '';

        heroSection.innerHTML = `
            <div class="hero-match-card live-mode headline-hero" id="heroMatchCard">
                <div class="card-status-pill pill-live" id="heroStatusPill">
                    <span class="pulse-dot"></span> LIVE${stageSuffix}
                </div>
                <div class="match-board">
                    <div class="team-col clickable" onclick="openTeamModal(${homeId})">
                        <div class="team-crest hero-crest">${data.live.home_team.charAt(0)}</div>
                        <span class="team-name">${data.live.home_team}</span>
                    </div>
                    <div class="score-display live-score-pulse">
                        <span class="score-num ${pulseClass}" id="heroHomeScore">${data.live.home_score}</span>
                        <span class="divider">:</span>
                        <span class="score-num ${pulseClass}" id="heroAwayScore">${data.live.away_score}</span>
                    </div>
                    <div class="team-col clickable" onclick="openTeamModal(${awayId})">
                        <div class="team-crest hero-crest">${data.live.away_team.charAt(0)}</div>
                        <span class="team-name">${data.live.away_team}</span>
                    </div>
                </div>
                <div class="momentum-bar-wrap">
                    <div class="momentum-title">Match Momentum</div>
                    <div class="momentum-track">
                        <div class="momentum-fill home-fill" style="width: ${homePct}%;"></div>
                        <div class="momentum-fill away-fill" style="width: ${100 - homePct}%;"></div>
                    </div>
                </div>
            </div>
        `;

        if (goalScored) {
            const scorer =
                data.live.home_score > previousLiveScore.home_score ? data.live.home_team :
                data.live.away_score > previousLiveScore.away_score ? data.live.away_team : null;
            if (scorer) {
                showLiveToast(`GOAL! ${scorer} \u2014 ${data.live.home_score} - ${data.live.away_score}`, 'goal');
            }
        }
        previousLiveScore = Object.assign({}, data.live);

    } else {
        previousLiveScore = null;

        const upcoming = [...ALL_FIXTURES_DATA]
            .filter(f => !f.is_played)
            .sort((a, b) => (a.match_date || '9999-99-99').localeCompare(b.match_date || '9999-99-99'))[0];

        if (!upcoming) {
            heroSection.innerHTML = `
                <div class="ios-card" style="text-align:center;">
                    <p class="empty-state">No upcoming fixtures scheduled</p>
                </div>
            `;
            if (pollUpdateInterval) { clearInterval(pollUpdateInterval); pollUpdateInterval = null; }
            currentFixtureId = null;
            return;
        }

        const dateLabel = upcoming.match_date
            ? new Date(upcoming.match_date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' })
            : 'Time TBD';
        const timeLabel = (upcoming.match_time && upcoming.match_time !== 'TBD') ? (' \u2022 ' + upcoming.match_time) : '';
        const stageBadge = upcoming.stage
            ? `<span class="phase-badge-hero phase-${upcoming.stage_css}">${upcoming.stage.toUpperCase()}</span> `
            : '';

        heroSection.innerHTML = `
            <div class="hero-match-card headline-hero" id="heroMatchCard">
                <div class="card-status-pill" id="heroStatusPill">${stageBadge}UPCOMING HEADLINE FIXTURE</div>

function refreshDateChipCounts() {
    document.querySelectorAll('.date-chip').forEach(chip => {
        const dateStr = chip.dataset.date;
        const count = ALL_FIXTURES_DATA.filter(f => f.match_date === dateStr).length;
        let countEl = chip.querySelector('.date-chip-count');

            if (!countEl) {
                countEl = document.createElement('span');
                countEl.className = 'date-chip-count';
                chip.appendChild(countEl);

            countEl.textContent = count;
        } else if (countEl) {
            countEl.remove();
        }

        filterFixturesBySelectedDate(selectedDateFilter);

function renderSwissStandingsBody(standings, directCount, playoffCount, isSwissPro) {
    const tbody = document.getElementById('swissStandingsBody');
    if (!tbody) return;
    if (!standings || standings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No Swiss standings available</td></tr>';
        return;
    }

    function statusFor(rank) {
        if (!isSwissPro) return null;
        if (rank <= directCount) return 'direct';
        if (rank <= directCount + playoffCount) return 'playoff';
        return 'eliminated';
    }

    tbody.innerHTML = standings.map((team, i) => {
        const rank = i + 1;
        const status = statusFor(rank);
        const rowClass = status ? `row-${status}` : '';
        const dot = status ? `<span class="row-status-dot dot-${status}"></span>` : '';
        return `
            <tr class="clickable standings-row ${rowClass}" onclick="openTeamModal(${team.id})">
                <td class="pos-col">${rank}</td>
                <td>${dot}<span class="team-name-cell">${team.name}</span></td>
                <td class="text-center">${team.played}</td>
                <td class="text-center">${team.wins}</td>
                <td class="text-center">${team.draws}</td>
                <td class="text-center">${team.losses}</td>
                <td class="text-center ${team.goal_diff >= 0 ? 'text-success' : 'text-danger'}">${team.goal_diff >= 0 ? '+' : ''}${team.goal_diff}</td>
                <td class="text-center pts-cell">${team.points}</td>
            </tr>
        `;
    }).join('');
}

function renderPhaseStandingsBody(phase, standings) {
    const tbody = document.getElementById(`${phase}StandingsBody`);
    if (!tbody) return;
    if (!standings || standings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center">No ${phase} teams yet</td></tr>`;

    }
    tbody.innerHTML = standings.map((team, i) => `
        <tr class="clickable" onclick="openTeamModal(${team.id})">

            <td><strong>${team.name}</strong></td>

            <td>${team.goal_diff >= 0 ? '+' : ''}${team.goal_diff}</td>
            <td class="text-right pts-cell">${team.points}</td>
        </tr>
    `).join('');
}

function launchConfettiOnCanvas(canvas, durationMs) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const parent = canvas.parentElement;

    function resize() {
        canvas.width = parent.offsetWidth;
        canvas.height = parent.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['#FFD700', '#FF9500', '#34C759', '#007AFF', '#FF3B30', '#FFFFFF'];
    const pieces = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.5,
        r: 4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 1.5 + Math.random() * 2.5,
        speedX: (Math.random() - 0.5) * 2,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
    }));

    const start = performance.now();

    function frame(now) {
        const elapsed = now - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.y += p.speedY;
            p.x += p.speedX;
            p.rotation += p.rotSpeed;
            if (p.y > canvas.height + 20) {
                p.y = -20;
                p.x = Math.random() * canvas.width;
            }
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            if (p.shape === 'rect') {
                ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.r / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

        if (elapsed < durationMs) {
            requestAnimationFrame(frame);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    requestAnimationFrame(frame);
}

function initChampionConfetti() {
    const canvas = document.getElementById('confettiCanvas');
    if (canvas) launchConfettiOnCanvas(canvas, 2600);
}

function shareChampionResult() {
    const nameEl = document.querySelector('.champion-name');
    const subEl = document.querySelector('.champion-subtitle');
    const text = nameEl && subEl
        ? `${nameEl.textContent} are champions of ${subEl.textContent}!`
        : 'We have a champion!';

    if (navigator.share) {
        navigator.share({ text }).catch(() => {});
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            showLiveToast('Result copied to clipboard', 'final');
        });
    } else {
        showLiveToast(text, 'final');
    }
}

function applyLiveUpdate(data) {
    const nameToId = {};
    (data.standings || []).forEach(t => { nameToId[t.name] = t.id; });

    ALL_TEAMS_DATA.length = 0;
    (data.standings || []).forEach(t => ALL_TEAMS_DATA.push(t));

    ALL_FIXTURES_DATA.length = 0;
    (data.fixtures || []).forEach(f => {
        const [datePart, timePart] = (f.match_date || '').split('T');
        ALL_FIXTURES_DATA.push({
            id: f.id,
            home_team_id: nameToId[f.home_team__name] ?? null,
            away_team_id: nameToId[f.away_team__name] ?? null,
            home_team_name: f.home_team__name,
            away_team_name: f.away_team__name,
            match_date: datePart || '',
            match_time: timePart ? timePart.slice(0, 5) : 'TBD',
            group: '',
            is_played: f.is_played,
            is_live: f.is_live,
            home_score: f.home_score,
            away_score: f.away_score,
            stage: f.stage || '',
            stage_css: f.stage_css || ''
        });
    });

    ALL_RESULTS_DATA.length = 0;
    (data.results || []).forEach(r => {
        ALL_RESULTS_DATA.push({
            home_team: r.home_team,
            away_team: r.away_team,
            home_score: r.home_score,
            away_score: r.away_score,
            match_date: r.match_date ? r.match_date.split('T')[0] : null
        });
    });

    const currentKeys = new Set(ALL_RESULTS_DATA.map(resultKey));
    if (knownResultKeys === null) {
        freshResultKeys = new Set();
    } else {
        const newlyLanded = ALL_RESULTS_DATA.filter(r => !knownResultKeys.has(resultKey(r)));
        freshResultKeys = new Set(newlyLanded.map(resultKey));
        newlyLanded.forEach(r => {
            showLiveToast(`Full time: ${r.home_team} ${r.home_score} - ${r.away_score} ${r.away_team}`, 'final');
        });
        if (newlyLanded.length > 0) {
            setTimeout(() => { freshResultKeys = new Set(); renderResultsList(); }, 20000);
        }
    }
    knownResultKeys = currentKeys;

    const activeQuery = (document.getElementById('teamSearchInput')?.value || '').toLowerCase();
    filteredTeams = activeQuery
        ? ALL_TEAMS_DATA.filter(t => t.name.toLowerCase().includes(activeQuery))
        : [...ALL_TEAMS_DATA];
    const maxPage = Math.max(1, Math.ceil(filteredTeams.length / itemsPerPage));
    currentPage = Math.min(currentPage, maxPage);

    renderHeroCard(data, nameToId);
    renderFixturesList();
    renderStandingsTable();
    renderLeaderboards();
    renderLatestResult();
    updateKpiCounts(data);
    renderTeamDirectory();
    renderFavoritesCarousel();
    syncAllFavoritesUI();
    refreshDateChipCounts();

    renderSwissStandingsBody(
        data.swiss_standings,
        data.swiss_direct_count,
        data.swiss_playoff_count,
        data.is_swiss_pro
    );
    renderPhaseStandingsBody('playoff', data.playoff_standings);
    renderPhaseStandingsBody('knockout', data.knockout_standings);
    syncStandingsPhaseVisibility(data);

    revealChampionCardIfNeeded(data);

    // Refresh the team modal in place (same tab) instead of resetting it -
    // this was previously snapping users on Fixtures/Results back to Overview
    // every 15s because openTeamModal() always rebuilt with Overview active.
    const drawerOpen = document.getElementById('teamDrawerModal')?.classList.contains('active');
    if (drawerOpen && activeModalTeamId !== null) {
        openTeamModal(activeModalTeamId, { preserveTab: true });
    }

    if (data.swiss_rounds !== undefined && data.total_swiss_rounds !== undefined) {
        updateSwissRoundsDisplay(data);
    }
    requestAnimationFrame(updateStickyStandingsOffsets);
}

async function fetchTournamentLiveUpdate() {
    if (typeof TOURNAMENT_ID === 'undefined' || !TOURNAMENT_ID) {
        console.warn('TOURNAMENT_ID is missing - live updates are disabled.');
        return;
    }
    try {
        const response = await fetch(`/tournament-live/${TOURNAMENT_ID}/`);
        if (!response.ok) throw new Error(`tournament-live returned ${response.status}`);
        const data = await response.json();
        applyLiveUpdate(data);
        syncFailureCount = 0;
        updateSyncBadge(true);
    } catch (e) {
        console.warn('Live update fetch failed:', e);
        syncFailureCount += 1;
        if (syncFailureCount >= 2) updateSyncBadge(false);
    }
}

function startLiveUpdates(intervalMs = 15000) {
    fetchTournamentLiveUpdate();
    if (liveUpdateInterval) clearInterval(liveUpdateInterval);
    liveUpdateInterval = setInterval(fetchTournamentLiveUpdate, intervalMs);
}

(function initCaveEffect() {
    document.addEventListener('DOMContentLoaded', () => {
        setupCylinderPadding();

        setTimeout(() => {
            scrollToToday(false);
            applyCylinderEffect();
        }, 240);

        const viewport = document.getElementById('dateStripViewport');
        if (!viewport) return;

        let cylRAF = null;
        const scheduleCylinderUpdate = () => {
            if (cylRAF) return;
            cylRAF = requestAnimationFrame(() => {
                applyCylinderEffect();
                cylRAF = null;
            });
        };

        viewport.addEventListener('scroll', scheduleCylinderUpdate, { passive: true });

        window.addEventListener('resize', () => {
            setupCylinderPadding();
            applyCylinderEffect();
        });
        window.addEventListener('resize', updateStickyStandingsOffsets);
    });
})();
