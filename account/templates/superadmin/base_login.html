<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'admin/includes/_admin_pwa_head.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Tournament Manager{% endblock %}</title>

    <!-- Bootstrap 5 & Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card-bg: rgba(255, 255, 255, 0.85);
            --ios-tint: #007aff;
            --ios-text-primary: #1c1c1e;
            --ios-text-secondary: #8e8e93;
            --ios-border: rgba(60, 60, 67, 0.12);
            --ios-input-bg: rgba(118, 118, 128, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(142, 142, 147, 0.08) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            color: var(--ios-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .auth-card {
            background: var(--ios-card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 2rem 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        /* iOS Alert Styling */
        .messages .alert {
            border-radius: 14px;
            border: none;
            padding: 0.85rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-bottom: 1.25rem;
        }


        .alert-danger {
            background-color: rgba(255, 59, 48, 0.12);
            color: #d70015;
        }

        .alert-success {
            background-color: rgba(52, 199, 89, 0.12);
            color: #248a3d;
        }

        .alert-warning {
            background-color: rgba(255, 149, 0, 0.12);
            color: #c67100;
        }

        .alert-info {
            background-color: rgba(0, 122, 255, 0.12);
            color: #0062cc;
        }

        @media (max-width: 576px) {
            body {
                padding: 1rem 0.75rem;
            }
            .auth-card {
                padding: 1.5rem 1.25rem;
                border-radius: 20px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Django System Messages -->
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show d-flex align-items-center justify-content-between" role="alert">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-x-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.7rem;"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Template Content -->
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
